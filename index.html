<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#b8185a">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Cuaderno de Finca (prueba)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: una columna tipo cuaderno de campo, navegación inferior fija, fichas en hoja deslizante */
:root{
  --bg:#f4f6f0; --surface:#ffffff; --sunk:#eaeee4; --ink:#1c2a1e; --muted:#5d6b5f; --line:#dbe1d3;
  --accent:#b8185a; --accent-soft:#fbe3ee; --on-accent:#ffffff;
  --leaf:#3b7a36; --leaf-soft:#e2efdc;
  --ok:#2c7a31; --ok-soft:#e1f1e1; --warn:#a35f00; --warn-soft:#fdefd9; --bad:#b3261e;
  --shadow:0 10px 30px rgba(28,42,30,.14);
  --f-display:"Bricolage Grotesque",ui-rounded,system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111611; --surface:#1a211a; --sunk:#141a14; --ink:#e6ede2; --muted:#9aa89a; --line:#2b352b;
  --accent:#ef6aa1; --accent-soft:#3a1a28; --on-accent:#1a0b12;
  --leaf:#86c77a; --leaf-soft:#1f2f1d;
  --ok:#7fcf83; --ok-soft:#18301a; --warn:#f0b35a; --warn-soft:#352812; --bad:#ff8a80;
  --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111611; --surface:#1a211a; --sunk:#141a14; --ink:#e6ede2; --muted:#9aa89a; --line:#2b352b;
  --accent:#ef6aa1; --accent-soft:#3a1a28; --on-accent:#1a0b12;
  --leaf:#86c77a; --leaf-soft:#1f2f1d;
  --ok:#7fcf83; --ok-soft:#18301a; --warn:#f0b35a; --warn-soft:#352812; --bad:#ff8a80;
  --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--f-body);-webkit-font-smoothing:antialiased}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:0 110px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0}
.num{font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Cabecera */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:18px 14px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand>div{min-width:0}
[hidden]{display:none!important}
.mark{width:42px;height:42px;border-radius:50%;flex:none;background:
  radial-gradient(circle at 30% 35%,var(--ink) 0 1.2px,transparent 1.6px),
  radial-gradient(circle at 62% 28%,var(--ink) 0 1.2px,transparent 1.6px),
  radial-gradient(circle at 48% 58%,var(--ink) 0 1.2px,transparent 1.6px),
  radial-gradient(circle at 72% 64%,var(--ink) 0 1.2px,transparent 1.6px),
  radial-gradient(circle at 28% 70%,var(--ink) 0 1.2px,transparent 1.6px),
  radial-gradient(circle at 55% 82%,var(--ink) 0 1.2px,transparent 1.6px),
  radial-gradient(circle at 50% 50%,var(--accent-soft) 0 58%,var(--accent) 60%);}
.brand h1{font-size:1.35rem;line-height:1.1;letter-spacing:-.01em}
.brand p{margin:2px 0 0;color:var(--muted);font-size:.85rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stock{flex:none;text-align:right;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px 12px}
.stock small{display:block;font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.stock b{font-family:var(--f-display);font-size:1.15rem}

.banner{background:var(--warn-soft);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:14px;font-size:.9rem}

/* Barras de herramientas */
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-block:4px 14px}
.bar .grow{flex:1 1 auto}
.btn{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 16px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.leaf{background:var(--leaf);border-color:var(--leaf);color:var(--surface)}
.btn.danger{color:var(--bad)}
.btn.danger.armed{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.btn.small{padding:6px 12px;font-size:.85rem}
select.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 12px;max-width:100%}
.bar>select.chip{flex:1 1 140px;min-width:0}
.bar .grow{display:none}
.bar>.btn{flex:1 1 100%;justify-content:center}
@media (min-width:640px){.bar>.btn{flex:0 0 auto}.bar .grow{display:block}.bar>select.chip{flex:0 1 auto}}

/* Secciones */
.sec{margin-block:22px}
details.grp{margin-block:10px}
details.grp>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;user-select:none}
details.grp>summary::-webkit-details-marker{display:none}
details.grp>summary::after{content:"";flex:none;width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);margin:-4px 4px 0 auto;transition:transform .15s}
details.grp[open]>summary::after{transform:rotate(-135deg);margin-top:4px}
details.grp[open]>summary{border-radius:14px 14px 0 0;border-bottom-color:transparent}
details.grp>.gb{border:1px solid var(--line);border-top:0;border-radius:0 0 14px 14px;background:var(--bg);padding:10px}
details.grp>.gb>.list,details.grp>.gb .tscroll>.table{border-radius:10px}
details.grp.sec{margin-block:14px}
details.grp.sec>summary h2{margin:0;flex:1;min-width:0}
details.grp>summary .gt{flex:1;min-width:0;display:flex;flex-direction:column}
details.grp>summary .gt strong{font-family:var(--f-display);font-size:1rem}
details.grp>summary .gt span{font-size:.8rem;color:var(--muted)}
details.grp>summary .gm{text-align:right;font-variant-numeric:tabular-nums;font-weight:700;display:flex;flex-direction:column;align-items:flex-end;gap:2px}
details.grp>summary .gm small{font-weight:500;color:var(--muted);font-size:.78rem}
.dot{width:12px;height:12px;border-radius:4px;flex:none}
.k-campo{background:var(--leaf)}.k-alm{background:var(--muted)}.k-art{background:var(--warn)}.k-cosecha{background:var(--leaf)}.k-venta{background:var(--accent)}.k-ok{background:var(--ok)}.k-warn{background:var(--warn)}.k-info{background:var(--accent)}.k-leaf{background:var(--leaf)}.k-mute{background:var(--line)}.k-late{background:var(--bad)}
.tools{display:flex;gap:6px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.seg{display:inline-flex;flex-wrap:wrap;background:var(--sunk);border-radius:18px;padding:3px;gap:2px}
.seg button{border:0;background:none;border-radius:999px;padding:6px 12px;font-weight:600;font-size:.85rem;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.sec h2{font-size:1.05rem;margin-bottom:10px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sec h2 small{font-family:var(--f-body);font-weight:500;color:var(--muted);font-size:.8rem}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:640px){.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.kpi small{display:block;color:var(--muted);font-size:.72rem;text-transform:uppercase;letter-spacing:.07em}
.kpi b{display:block;font-family:var(--f-display);font-size:clamp(1.1rem,5vw,1.45rem);line-height:1.2;margin-top:4px}
.kpi.hl{background:var(--accent-soft);border-color:transparent}
button.kpi{text-align:left;cursor:pointer;font:inherit;color:inherit;position:relative;width:100%}
button.kpi:hover{border-color:var(--muted)}
.kpi .chev{position:absolute;top:7px;right:10px;color:var(--muted);font-size:1.15rem;line-height:1}
[data-act^="go"]{cursor:pointer}
tr[data-act]:hover td{background:var(--sunk)}
td[data-act]{text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.m[data-act]:hover{background:var(--sunk);border-radius:4px}
.legend span[data-act]{text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.stock[data-act]:hover{border-color:var(--muted)}
.kpi.hl b{color:var(--accent)}

.table{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.tscroll{overflow-x:auto}
.table th,.table td{padding:9px 12px;text-align:right;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;white-space:nowrap}
.table th{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;background:var(--sunk)}
.table th:first-child,.table td:first-child{text-align:left}
.table tr:last-child td{border-bottom:0}
.table td.strong{font-weight:700}

/* Listas */
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 14px;border-bottom:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;text-align:left;width:100%}
.row:last-child{border-bottom:0}
.row:hover{background:var(--sunk)}
.date{width:44px;text-align:center;line-height:1.05}
.date b{display:block;font-family:var(--f-display);font-size:1.2rem}
.date small{font-size:.68rem;text-transform:uppercase;color:var(--muted);letter-spacing:.05em}
.row .main{min-width:0}
.row .main strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .main span{display:block;color:var(--muted);font-size:.84rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .fig{text-align:right;font-variant-numeric:tabular-nums}
.row .fig b{display:block;font-weight:700}
.pill{display:inline-block;font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:999px;letter-spacing:.02em}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.info{background:var(--accent-soft);color:var(--accent)}
.pill.leaf{background:var(--leaf-soft);color:var(--leaf)}
.pill.mute{background:var(--sunk);color:var(--muted)}
.pill.late{background:var(--bad);color:var(--surface)}
.pills{display:flex;flex-wrap:wrap;gap:4px;justify-content:flex-end;margin-top:3px}
.who{display:inline-flex;align-items:center;gap:6px}
.who i{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.hist{list-style:none;margin:0;padding:0;font-size:.84rem;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.qty{width:100%;min-width:0;max-width:110px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 8px;text-align:right;font-variant-numeric:tabular-nums}
.reg{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--leaf-soft);border-radius:14px;padding:12px 14px;margin-bottom:14px}
.reg p{margin:0;flex:1 1 220px;font-size:.9rem}
.reg input{flex:1 1 140px;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 12px}
.team-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line)}
.team-row:last-child{border-bottom:0}
.mvt{display:inline-block;width:22px;height:22px;border-radius:50%;text-align:center;line-height:22px;font-weight:700;font-size:.85rem;flex:none}
.mvt.entrada{background:var(--ok-soft);color:var(--ok)}.mvt.uso{background:var(--warn-soft);color:var(--warn)}.mvt.traslado{background:var(--sunk);color:var(--muted)}
.lowbar{background:var(--warn-soft);border:1px solid var(--line);border-radius:12px;padding:9px 12px;font-size:.9rem;margin-bottom:10px}
.triple{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.triple .btn{justify-content:center;padding-inline:8px}
.perms{display:flex;flex-direction:column;gap:10px}
.perms fieldset{border:1px solid var(--line);border-radius:12px;padding:6px 12px 10px;margin:0;display:flex;flex-direction:column;gap:9px;background:var(--surface);min-width:0}
.perms legend{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;padding:0 6px}
.perms .check{font-weight:500!important}
.perms input:disabled+span{opacity:.6}
.row:disabled{cursor:default;color:inherit;opacity:1}
.row:disabled:hover{background:none}
.noprice [name=l-pr],.noprice #v-tot{display:none}
.gear{flex:none;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer;display:grid;place-items:center;padding:0}
.gear svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.gear[aria-current="page"]{color:var(--accent);background:var(--accent-soft);border-color:transparent}
.calhead{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.calhead h2{flex:1;font-size:1.2rem;text-align:center}
.calhead .x{background:var(--surface);border:1px solid var(--line)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:8px}
.cal .dow{font-size:.68rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:center;padding:2px 0 4px;font-weight:600}
.cal button{aspect-ratio:1/1;min-height:44px;border:1px solid transparent;background:none;border-radius:10px;cursor:pointer;padding:3px 0 0;display:flex;flex-direction:column;align-items:center;gap:3px;font:inherit;color:inherit;font-variant-numeric:tabular-nums}
.cal button:hover{background:var(--sunk)}
.cal button.hoy{border-color:var(--accent);font-weight:700;color:var(--accent)}
.cal button.sel{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.cal button.sel .dots i{box-shadow:0 0 0 1px var(--on-accent)}
.cal .dots{display:flex;gap:2px;flex-wrap:wrap;justify-content:center;max-width:100%;min-height:7px}
.cal .dots i{width:7px;height:7px;border-radius:50%;display:block}
.cal .dots i.ped{border-radius:2px;background:var(--accent)}
.cal .more{font-size:.6rem;line-height:1;opacity:.8}
.ndot{width:12px;height:12px;border-radius:50%;flex:none}
.dayhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:16px 0 8px}
.dayhead h2{font-size:1.05rem}
.row.done .main strong{text-decoration:line-through;opacity:.6}
.notetxt{white-space:pre-wrap;overflow-wrap:anywhere;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:12px}
.callegend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:.76rem;color:var(--muted);margin-top:8px}
.callegend span{display:inline-flex;align-items:center;gap:5px}
.callegend i{width:8px;height:8px;border-radius:50%;display:inline-block}
.mebtn{flex:none;width:38px;height:38px;border-radius:50%;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line);color:#fff;font-weight:700;font-size:1rem;cursor:pointer;display:grid;place-items:center}
.top .right{display:flex;align-items:center;gap:6px;flex:none}
@media (max-width:479px){.stock{padding:5px 9px}.stock b{font-size:1rem}.brand{gap:9px}.mark{width:36px;height:36px}.brand h1{font-size:1.2rem}}
.login{max-width:400px;margin:28px auto 0;display:flex;flex-direction:column;gap:14px}
.login h2{font-size:1.4rem}
.login .card{display:flex;flex-direction:column;gap:12px}
.err{color:var(--bad);font-size:.88rem;font-weight:600;margin:0}
.avatar{width:30px;height:30px;border-radius:50%;color:#fff;font-weight:700;font-size:.8rem;display:grid;place-items:center;flex:none}
.pl{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 14px;border-bottom:1px solid var(--line)}
.pl:last-child{border-bottom:0}
.pl .main strong{display:block}.pl .main span{display:block;font-size:.84rem;color:var(--muted)}
.plq{display:flex;flex-direction:column;align-items:flex-end;gap:3px;font-size:.7rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600}
.plq .qty{width:96px}.plq b{font-size:.95rem;color:var(--ink);text-transform:none;letter-spacing:0}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:22px 18px;text-align:center;color:var(--muted)}
.empty strong{display:block;color:var(--ink);font-family:var(--f-display);font-size:1.05rem;margin-bottom:4px}
.empty .btn{margin-top:12px}

/* Gráfico mensual */
.chart{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 12px 8px}
.bars{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:4px;height:140px;align-items:end;border-bottom:1px solid var(--line)}
.m{display:flex;gap:2px;align-items:end;height:100%;justify-content:center}
.m i{display:block;width:40%;max-width:12px;border-radius:3px 3px 0 0;min-height:1px}
.m i.c{background:var(--leaf)} .m i.v{background:var(--accent)}
.mlab{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:4px;font-size:.7rem;color:var(--muted);text-align:center;padding-top:4px}
.legend{display:flex;gap:14px;font-size:.78rem;color:var(--muted);margin-top:6px}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px;background:var(--leaf)}
.legend span.v::before{background:var(--accent)}
.meter{height:6px;background:var(--sunk);border-radius:6px;overflow:hidden;margin-top:6px}
.meter i{display:block;height:100%;background:var(--leaf)}

/* Navegación */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
nav.tabs .in{max-width:760px;margin:0 auto;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(58px,1fr);gap:2px;overflow-x:auto;scrollbar-width:none}
nav.tabs .in::-webkit-scrollbar{display:none}
nav.tabs .in.many{display:flex;gap:0;justify-content:space-between}
nav.tabs .in.many button{flex:1 1 auto;min-width:0;padding:6px 1px;font-size:.62rem;letter-spacing:-.01em}
nav.tabs .in.many button svg{width:21px;height:21px}
nav.tabs .in.many{overflow:hidden}
nav.tabs .in.many .badge{left:auto;right:0;top:0;min-width:15px;height:15px;line-height:15px;font-size:.6rem;padding:0 3px}
@media (min-width:480px){nav.tabs .in.many button{font-size:.72rem;letter-spacing:0;padding:6px 4px}}
nav.tabs button{background:none;border:0;padding:6px 2px;border-radius:10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.72rem;font-weight:600;color:var(--muted)}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}
nav.tabs button{position:relative;white-space:nowrap}
nav.tabs .badge{position:absolute;top:1px;left:calc(50% + 5px);min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--accent);color:var(--on-accent);font-size:.66rem;font-weight:700;line-height:17px;text-align:center;border:2px solid var(--surface);box-sizing:content-box}
nav.tabs .badge.soft{background:var(--muted)}
.row.unread{background:var(--accent-soft)}
.row.av .main strong{white-space:normal;font-weight:600;font-size:.92rem}
.row.unread .main strong::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--accent);margin-right:6px;vertical-align:1px}
.cnt{display:inline-block;min-width:20px;padding:1px 6px;border-radius:10px;background:var(--accent);color:var(--on-accent);font-size:.72rem;font-weight:700;text-align:center}
.msgs{display:flex;flex-direction:column;gap:6px;max-height:52vh;overflow-y:auto;padding:4px 2px 8px}
.bub{max-width:82%;padding:8px 12px;border-radius:16px;overflow-wrap:anywhere;white-space:pre-wrap;font-size:.95rem}
.bub small{display:block;font-size:.7rem;opacity:.75;margin-top:3px;white-space:normal}
.bub.mine{align-self:flex-end;background:var(--accent);color:var(--on-accent);border-bottom-right-radius:4px}
.bub.theirs{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:4px}

/* Hoja (formularios) */
.scrim{position:fixed;inset:0;z-index:10;background:rgba(10,16,10,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:20px 20px 0 0;box-shadow:var(--shadow);padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
@media (min-width:700px){.scrim{align-items:center}.sheet{border-radius:20px}}
.sheet header{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
.sheet header h2{font-size:1.25rem}
.x{border:0;background:var(--sunk);width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:1.2rem;line-height:1}
.f{display:flex;flex-direction:column;gap:12px}
.f label{display:flex;flex-direction:column;gap:4px;font-size:.8rem;font-weight:600;color:var(--muted)}
.f input,.f select,.f textarea{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;font-size:1rem;font-weight:400;color:var(--ink);width:100%;min-width:0}
.f textarea{min-height:64px;resize:vertical}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.check{flex-direction:row!important;align-items:center;gap:10px!important;font-size:.95rem!important;color:var(--ink)!important}
.check input{width:20px;height:20px;flex:none}
.lines{display:flex;flex-direction:column;gap:8px}
.line{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) 34px;grid-template-areas:"p p x" "c c c" "k e e";gap:6px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px}
.line [name=l-prod]{grid-area:p}.line [name=l-cal]{grid-area:c}.line [name=l-kg]{grid-area:k}.line [name=l-pr]{grid-area:e}.line .x{grid-area:x}
@media (min-width:520px){.line{grid-template-columns:minmax(0,1.2fr) minmax(0,1fr) minmax(0,.8fr) minmax(0,.8fr) 34px;grid-template-areas:"p c k e x"}}
.line input,.line select{padding:9px 8px!important}
.line .x{background:var(--sunk)}
.total{display:flex;justify-content:space-between;align-items:baseline;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.total b{font-family:var(--f-display);font-size:1.3rem}
.acts{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;margin-top:6px}
.acts .r{display:flex;gap:8px;flex-wrap:wrap}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:.92rem}
.kv dt{color:var(--muted)} .kv dd{margin:0;text-align:right;overflow-wrap:anywhere}
.hint{font-size:.82rem;color:var(--muted);margin:0}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:20;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:.9rem;max-width:calc(100% - 32px);box-shadow:var(--shadow)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand"><span class="mark" aria-hidden="true"></span><div><h1>Cuaderno de Finca</h1><p id="sub">Producción y ventas</p></div></div>
    <div class="right"><div class="stock" id="stockBox" data-act="go-stock" role="link" tabindex="0" hidden><small>En almacén</small><b class="num" id="stockTop">0 kg</b></div><button class="gear" id="gearBtn" data-act="tab:ajustes" aria-label="Ajustes" title="Ajustes" hidden><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/></svg></button><button class="mebtn" id="meBtn" data-act="perfil" aria-label="Mi perfil" hidden></button></div>
  </header>
  <div id="banner" class="banner" hidden></div>
  <main id="main"></main>
</div>

<nav class="tabs" aria-label="Secciones"><div class="in" id="navIn"></div></nav>

<div id="sheetRoot"></div>
<div id="toast" class="toast" role="status" hidden></div>

<script>
(()=>{
const DEF_CAL=['Extra','Primera','Segunda','Destrío'];
const MES=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const S={productos:[],parcelas:[],empresas:[],cosechas:[],ventas:[],pedidos:[],usuarios:[],mensajes:[],insumos:[],movimientos:[],notas:[],cfg:{}};
let openChat=null; const vistos=new Set(); let avisosListos=false;
let me={id:null}; const SESS='cf-sesion'; let fallos=0, bloqueoHasta=0, loginErr='';
const DEF_PROD={id:'pitahaya',nombre:'Pitahaya',calidades:DEF_CAL};
const loaded={};
let db=null, status='conectando', tab='resumen';
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const F={yr:String(new Date().getFullYear()), producto:'', parcela:'', estado:'', empresa:'', ped:'', gc:'mes', gv:'mes', gi:'campo', gm:'mes', calMes:today().slice(0,7), calDia:today()};
const armed={};
const OPEN={};const op=k=>OPEN[k]?'open':'';
function grp(k,kind,title,sub,meta,metaSub,body,d){return `<details class="grp" data-k="${k}" ${op(k,d)}><summary><span class="dot k-${kind}"></span><span class="gt"><strong>${title}</strong>${sub?`<span>${sub}</span>`:''}</span><span class="gm">${meta}${metaSub?`<small>${metaSub}</small>`:''}</span></summary><div class="gb"><div class="list">${body}</div></div></details>`}
const segBtns=(name,cur,opts)=>`<div class="tools"><span class="hint">Agrupar por</span><div class="seg" role="group">${opts.map(([v,l])=>`<button type="button" data-act="grp:${name}:${v}" aria-pressed="${cur===v}">${l}</button>`).join('')}</div></div>`;
const isoD=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const lunes=f=>{const d=new Date(f+'T12:00');if(isNaN(d))return '';d.setDate(d.getDate()-(d.getDay()+6)%7);return isoD(d)};
const esPeriodo=m=>m==='mes'||m==='semana'||m==='dia';
const PERIODOS=[['mes','Mes'],['semana','Semana'],['dia','Día']];
const periodoKey=(f,m)=>!f?'':m==='dia'?f:m==='semana'?lunes(f):f.slice(0,7);
function periodoTitulo(k,m){
  if(!k)return 'Sin fecha';
  if(m==='dia'){const d=new Date(k+'T12:00'),t=d.toLocaleDateString('es-ES',{weekday:'long'});return t.charAt(0).toUpperCase()+t.slice(1)+' '+d.getDate()+' '+MES[d.getMonth()]+' '+d.getFullYear()}
  if(m==='semana'){const a=new Date(k+'T12:00'),b=new Date(a);b.setDate(b.getDate()+6);const f=(d,y)=>d.getDate()+' '+MES[d.getMonth()]+(y?' '+d.getFullYear():'');return `Semana del ${f(a,a.getFullYear()!==b.getFullYear())} al ${f(b,true)}`}
  return mesLargo(k+'-01');
}
const mesLargo=f=>{const [y,m]=(f||'').split('-');const n=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'][+m-1];return n?n+' '+y:'Sin fecha'};
function groupBy(arr,keyFn){const m=new Map();arr.forEach(x=>{const k=keyFn(x);if(!m.has(k))m.set(k,[]);m.get(k).push(x)});return [...m.entries()]}

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nf=new Intl.NumberFormat('es-ES',{maximumFractionDigits:1});
const eurF=new Intl.NumberFormat('es-ES',{style:'currency',currency:'EUR'});
const kg=n=>nf.format(n||0)+' kg', eur=n=>eurF.format(n||0);
const num=v=>{v=String(v??'').trim();if(!v)return 0;if(v.includes(','))v=v.replace(/\./g,'').replace(',','.');const n=parseFloat(v);return isFinite(n)?n:0};
const show=n=>n?String(n).replace('.',','):'';
const byId=(arr,id)=>arr.find(x=>x.id===id);
const pidOf=x=>x.productoId||'pitahaya';
function prods(){
  const l=S.productos.slice().sort((a,b)=>(a.nombre||'').localeCompare(b.nombre||''));
  const usado=S.cosechas.some(x=>pidOf(x)==='pitahaya')||S.ventas.some(v=>(v.lineas||[]).some(x=>pidOf(x)==='pitahaya'));
  if(!byId(l,'pitahaya')&&(!l.length||usado))l.unshift(DEF_PROD);
  return l;
}
const prod=id=>byId(prods(),id);
const prodName=id=>prod(id)?.nombre||'Producto borrado';
const cal=pid=>{const p=prod(pid||prods()[0]?.id);return p&&Array.isArray(p.calidades)&&p.calidades.length?p.calidades:DEF_CAL};
const empName=id=>byId(S.empresas,id)?.nombre||'Empresa borrada';
const parName=id=>id?(byId(S.parcelas,id)?.nombre||'Parcela borrada'):'Sin parcela';
const lin=(v,pid=F.producto)=>(v.lineas||[]).filter(l=>!pid||pidOf(l)===pid);
const vKg=(v,pid)=>lin(v,pid).reduce((a,l)=>a+(+l.kg||0),0);
const vTot=(v,pid)=>lin(v,pid).reduce((a,l)=>a+(+l.kg||0)*(+l.precio||0),0);
const okProd=x=>!F.producto||pidOf(x)===F.producto;
const hasProd=v=>!F.producto||lin(v).length>0;
const inYr=f=>F.yr==='todo'||String(f||'').startsWith(F.yr);
const sortDesc=a=>a.slice().sort((x,y)=>(y.fecha||'').localeCompare(x.fecha||'')||(y.creado||0)-(x.creado||0));
const fdate=f=>{if(!f)return '';const [y,m,d]=f.split('-');return `${+d} ${MES[+m-1]} ${y}`};
const dateBox=f=>{const [y,m,d]=(f||'--').split('-');return `<div class="date"><b>${+d||''}</b><small>${MES[+m-1]||''}</small></div>`};

function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,3200)}
function errMsg(e){
  if(e&&e.code==='invalid_argument')return 'No tienes permiso para guardar. Pide al dueño de la app que te comparta como Editor.';
  if(e&&e.code==='quota_exceeded')return 'La base de datos está llena. Borra registros antiguos.';
  return 'No se pudo guardar. Revisa la conexión e inténtalo de nuevo.';
}
async function put(col,id,data){
  if(!db){toast('Abre la app con tu cuenta de Claude para guardar datos.');return false}
  try{const ref=id?db.collection(col).doc(id):db.collection(col).doc();await ref.set(data);return ref.id||true}
  catch(e){toast(errMsg(e));return false}
}
async function del(col,id){
  if(!db)return false;
  try{await db.collection(col).doc(id).delete();return true}catch(e){toast(errMsg(e));return false}
}

/* ---------- Cálculos ---------- */
function stockPorCalidad(pid=F.producto){
  const m={}, key=(p,c)=>p+'|'+c, get=(p,c)=>m[key(p,c)]??={p,c,co:0,v:0};
  prods().filter(p=>!pid||p.id===pid).forEach(p=>cal(p.id).forEach(c=>get(p.id,c)));
  S.cosechas.forEach(x=>{if(!pid||pidOf(x)===pid)get(pidOf(x),x.calidad).co+=+x.kg||0});
  S.ventas.forEach(v=>lin(v,pid).forEach(l=>{get(pidOf(l),l.calidad).v+=+l.kg||0}));
  return Object.values(m);
}
function stockTotal(){return stockPorCalidad('').reduce((a,x)=>a+x.co-x.v,0)}
function years(){const s=new Set([String(new Date().getFullYear())]);[...S.cosechas,...S.ventas].forEach(x=>x.fecha&&s.add(x.fecha.slice(0,4)));return [...s].sort().reverse()}
function lastPrice(empId,pid,calidad){for(const v of sortDesc(S.ventas)){if(empId&&v.empresaId!==empId)continue;const l=(v.lineas||[]).find(l=>pidOf(l)===pid&&l.calidad===calidad&&+l.precio);if(l)return l.precio}return ''}
function nextNum(fecha){const y=(fecha||today()).slice(0,4);let m=0;S.ventas.forEach(v=>{const r=/^A(\d{4})-(\d+)$/.exec(v.num||'');if(r&&r[1]===y)m=Math.max(m,+r[2])});return `A${y}-${String(m+1).padStart(4,'0')}`}

/* ---------- Vistas ---------- */
const yrSelect=()=>`<select class="chip" id="f-yr" aria-label="Campaña">${years().map(y=>`<option value="${y}" ${F.yr===y?'selected':''}>Campaña ${y}</option>`).join('')}<option value="todo" ${F.yr==='todo'?'selected':''}>Todos los años</option></select>`;
const prodSelect=()=>prods().length>1?`<select class="chip" id="f-prod" aria-label="Producto"><option value="">Todos los productos</option>${prods().map(p=>`<option value="${p.id}" ${F.producto===p.id?'selected':''}>${esc(p.nombre)}</option>`).join('')}</select>`:'';
const emptyBox=(t,d,act,label)=>`<div class="empty"><strong>${t}</strong>${d}${act&&(!NEED[act]||can(NEED[act]))?`<div><button class="btn primary" data-act="${act}">${label}</button></div>`:''}</div>`;

const go=(t,params)=>tabs().includes(t)?` data-act="go:${t}:${esc(params||'')}" role="link" tabindex="0"`:'';
function vResumen(){
  const cs=S.cosechas.filter(x=>inYr(x.fecha)&&okProd(x)), vs=S.ventas.filter(x=>inYr(x.fecha)&&hasProd(x));
  const kc=cs.reduce((a,x)=>a+(+x.kg||0),0), kv=vs.reduce((a,v)=>a+vKg(v),0);
  const fact=vs.reduce((a,v)=>a+vTot(v),0), pend=vs.filter(v=>!v.cobrado).reduce((a,v)=>a+vTot(v),0);
  const st=stockPorCalidad();
  const K=(lab,val,cls,g)=>g?`<button class="kpi ${cls}"${g}><small>${lab}</small><b class="num">${val}</b><span class="chev" aria-hidden="true">›</span></button>`:`<div class="kpi ${cls}"><small>${lab}</small><b class="num">${val}</b></div>`;
  const ym=i=>F.yr+'-'+String(i+1).padStart(2,'0');
  let h=`<div class="bar">${yrSelect()}${prodSelect()}<span class="grow"></span>${can('cos_editar')?'<button class="btn leaf small" data-act="add-cosecha">+ Cosecha</button>':''}${can('ventas_editar')?'<button class="btn primary small" data-act="add-venta">+ Venta</button>':''}</div>
  <div class="kpis">
    ${K('Cosechado',kg(kc),'',go('cosechas','gc=mes;open=*first'))}
    ${K('Vendido',kg(kv),'',go('ventas','gv=mes;open=*first'))}
    ${K('Facturado',eur(fact),'',go('ventas','gv=empresa'))}
    ${K('Pendiente de cobro',eur(pend),'hl',go('ventas','estado=pendiente;gv=empresa;open=*all'))}
  </div>`;
  if(!S.cosechas.length&&!S.ventas.length){
    return h+`<div class="sec">${emptyBox('Aún no hay datos','Anota la primera cosecha en kg y después registra las ventas a cada empresa. El stock se calcula solo.','add-cosecha','Anotar primera cosecha')}</div>`;
  }
  h+=stockTable(st);
  if(F.yr!=='todo'){
    const mc=Array(12).fill(0), mv=Array(12).fill(0);
    cs.forEach(x=>mc[+x.fecha.slice(5,7)-1]+=+x.kg||0);
    vs.forEach(v=>mv[+v.fecha.slice(5,7)-1]+=vKg(v));
    const max=Math.max(1,...mc,...mv);
    h+=`<details class="grp sec" data-k="s-kilos-por-mes" ${op('s-kilos-por-mes',true)}><summary><h2>Kilos por mes <small>${F.yr}</small></h2></summary><div class="gb"><div class="chart"><div class="bars">${mc.map((c,i)=>`<div class="m" title="${MES[i]}: ${kg(c)} cosechados, ${kg(mv[i])} vendidos"${c?go('cosechas','gc=mes;open=c-mes-'+ym(i)):mv[i]?go('ventas','gv=mes;open=v-mes-'+ym(i)):''}><i class="c" style="height:${c/max*100}%"></i><i class="v" style="height:${mv[i]/max*100}%"${mv[i]?go('ventas','gv=mes;open=v-mes-'+ym(i)):''}></i></div>`).join('')}</div><div class="mlab">${MES.map((m,i)=>`<span${mc[i]?go('cosechas','gc=mes;open=c-mes-'+ym(i)):''}>${m[0].toUpperCase()}</span>`).join('')}</div><div class="legend"><span${go('cosechas','gc=mes;open=*first')}>Cosechado</span><span class="v"${go('ventas','gv=mes;open=*first')}>Vendido</span></div><p class="hint" style="margin:6px 0 0">Toca un mes para ver sus cosechas; la barra fucsia abre sus ventas.</p></div></div></details>`;
  }
  if(!F.producto&&prods().length>1){
    const pp=prods().map(p=>({p,co:cs.filter(x=>pidOf(x)===p.id).reduce((a,x)=>a+(+x.kg||0),0),v:vs.reduce((a,v)=>a+vKg(v,p.id),0),e:vs.reduce((a,v)=>a+vTot(v,p.id),0)})).filter(x=>x.co||x.v);
    if(pp.length)h+=`<details class="grp sec" data-k="s-por-producto" ${op('s-por-producto',false)}><summary><h2>Por producto</h2></summary><div class="gb"><div class="tscroll"><table class="table"><thead><tr><th>Producto</th><th>Cosechado</th><th>Vendido</th><th>€/kg medio</th><th>Importe</th></tr></thead><tbody>${pp.map(x=>{const gv=go('ventas','producto='+x.p.id+';gv=mes;open=*first');return `<tr${go('cosechas','producto='+x.p.id+';gc=mes;open=*first')}><td>${esc(x.p.nombre)}</td><td>${kg(x.co)}</td><td${gv}>${kg(x.v)}</td><td${gv}>${x.v?eur(x.e/x.v):'—'}</td><td class="strong"${gv}>${eur(x.e)}</td></tr>`}).join('')}</tbody></table></div></div></details>`;
  }
  const porEmp={};vs.forEach(v=>{const e=porEmp[v.empresaId]??={kg:0,eur:0,pend:0};e.kg+=vKg(v);e.eur+=vTot(v);if(!v.cobrado)e.pend+=vTot(v)});
  const emps=Object.entries(porEmp).sort((a,b)=>b[1].eur-a[1].eur);
  if(emps.length)h+=`<details class="grp sec" data-k="s-ventas-por-empresa" ${op('s-ventas-por-empresa',false)}><summary><h2>Ventas por empresa</h2></summary><div class="gb"><div class="tscroll"><table class="table"><thead><tr><th>Empresa</th><th>Kg</th><th>€/kg medio</th><th>Importe</th><th>Pendiente</th></tr></thead><tbody>${
    emps.map(([id,e])=>`<tr${go('ventas','empresa='+id+';gv=mes;open=*all')}><td>${esc(empName(id))}</td><td>${kg(e.kg)}</td><td>${e.kg?eur(e.eur/e.kg):'—'}</td><td class="strong">${eur(e.eur)}</td><td${e.pend?go('ventas','empresa='+id+';estado=pendiente;gv=mes;open=*all'):''}>${e.pend?`<span class="pill warn">${eur(e.pend)}</span>`:'<span class="pill ok">Al día</span>'}</td></tr>`).join('')
  }</tbody></table></div></div></details>`;
  const porPar={};cs.forEach(x=>porPar[x.parcelaId||'']=(porPar[x.parcelaId||'']||0)+(+x.kg||0));
  const pars=Object.entries(porPar).sort((a,b)=>b[1]-a[1]);const pmax=Math.max(1,...pars.map(p=>p[1]));
  if(pars.length)h+=`<details class="grp sec" data-k="s-cosecha-por-parcela" ${op('s-cosecha-por-parcela',false)}><summary><h2>Cosecha por parcela</h2></summary><div class="gb"><div class="list">${pars.map(([id,k])=>`<div class="row" style="grid-template-columns:minmax(0,1fr) auto"${id?go('cosechas','parcela='+id+';gc=mes;open=*first'):go('cosechas','gc=parcela;open=c-parcela-')}><div class="main"><strong>${esc(parName(id))}</strong><div class="meter"><i style="width:${k/pmax*100}%"></i></div></div><div class="fig"><b>${kg(k)}</b></div></div>`).join('')}</div></div></details>`;
  return h;
}

function vCosechas(){
  let cs=sortDesc(S.cosechas.filter(x=>inYr(x.fecha)&&okProd(x)&&(!F.parcela||(x.parcelaId||'')===F.parcela)));
  const tot=cs.reduce((a,x)=>a+(+x.kg||0),0);
  let h=`<div class="bar">${yrSelect()}${prodSelect()}<select class="chip" id="f-parcela" aria-label="Parcela"><option value="">Todas las parcelas</option>${S.parcelas.map(p=>`<option value="${p.id}" ${F.parcela===p.id?'selected':''}>${esc(p.nombre)}</option>`).join('')}</select><span class="grow"></span>${can('cos_editar')?'<button class="btn leaf" data-act="add-cosecha">+ Anotar cosecha</button>':''}</div>`;
  if(!cs.length)return h+emptyBox('Sin cosechas en este periodo','Cada vez que recojan, anota fecha, parcela, calidad y kilos.','add-cosecha','Anotar cosecha');
  const edC=can('cos_editar');const rowC=x=>`<button class="row" ${edC?`data-act="edit-cosecha:${x.id}"`:'disabled'}>${dateBox(x.fecha)}<div class="main"><strong>${esc(F.gc==='parcela'?prodName(pidOf(x)):parName(x.parcelaId))}</strong><span>${F.gc==='parcela'?'':prods().length>1&&F.gc!=='producto'?esc(prodName(pidOf(x)))+' · ':''}${esc(x.calidad||'')}${x.nota?' · '+esc(x.nota):''}</span></div><div class="fig"><b>${kg(x.kg)}</b></div></button>`;
  const key=F.gc==='parcela'?(x=>x.parcelaId||''):F.gc==='producto'?(x=>pidOf(x)+'|'+x.calidad):(x=>periodoKey(x.fecha,F.gc));
  let gs=groupBy(cs,key);if(!esPeriodo(F.gc))gs.sort((a,b)=>b[1].reduce((s,x)=>s+(+x.kg||0),0)-a[1].reduce((s,x)=>s+(+x.kg||0),0));
  h+=segBtns('gc',F.gc,[...PERIODOS,['parcela','Parcela'],['producto','Producto']])+`<p class="hint" style="margin-bottom:8px">${cs.length} registros · <b class="num">${kg(tot)}</b></p>`;
  h+=gs.map(([k,xs],i)=>{const t=xs.reduce((a,x)=>a+(+x.kg||0),0);const title=F.gc==='parcela'?esc(parName(k)):F.gc==='producto'?esc(prodName(k.split('|')[0]))+' · '+esc(k.split('|')[1]):periodoTitulo(k,F.gc);const dias=new Set(xs.map(x=>x.fecha)).size;
    return grp(`c-${F.gc}-${k}`,'cosecha',title,F.gc==='dia'?`${xs.length} ${xs.length===1?'registro':'registros'}`:`${xs.length} registros · ${dias} ${dias===1?'día':'días'} de recogida`,kg(t),'',xs.map(rowC).join(''),i===0)}).join('');
  return h;
}

function vVentas(){

  let h=`<div class="bar">${yrSelect()}${prodSelect()}<select class="chip" id="f-estado" aria-label="Estado"><option value="">Todas</option><option value="pendiente" ${F.estado==='pendiente'?'selected':''}>Pendientes de cobro</option><option value="cobrado" ${F.estado==='cobrado'?'selected':''}>Cobradas</option></select><select class="chip" id="f-empresa" aria-label="Empresa"><option value="">Todas las empresas</option>${S.empresas.map(e=>`<option value="${e.id}" ${F.empresa===e.id?'selected':''}>${esc(e.nombre)}</option>`).join('')}</select><span class="grow"></span>${can('ventas_editar')?'<button class="btn primary" data-act="add-venta">+ Nueva venta</button>':''}</div>`;

  const keyV=F.gv==='empresa'?(v=>v.empresaId):F.gv==='cobro'?(v=>v.cobrado?'1':'0'):(v=>periodoKey(v.fecha,F.gv));
  let gs=groupBy(vs,keyV);if(F.gv==='empresa')gs.sort((a,b)=>b[1].reduce((s,v)=>s+vTot(v),0)-a[1].reduce((s,v)=>s+vTot(v),0));if(F.gv==='cobro')gs.sort((a,b)=>a[0].localeCompare(b[0]));
  h+=segBtns('gv',F.gv,[...PERIODOS,['empresa','Empresa'],['cobro','Cobro']])+`<p class="hint" style="margin-bottom:8px">${vs.length} ventas · <b class="num">${kg(tk)}</b> · <b class="num">${eur(tot)}</b></p>`;
  h+=gs.map(([k,xs],i)=>{const t=xs.reduce((a,v)=>a+vTot(v),0),kk=xs.reduce((a,v)=>a+vKg(v),0),pe=xs.filter(v=>!v.cobrado).reduce((a,v)=>a+vTot(v),0);

    const kind=F.gv==='cobro'?(k==='1'?'ok':'warn'):'venta';

async function hashClave(clave,sal,it=120000){
  const enc=new TextEncoder();
  if(window.crypto?.subtle){try{
    const key=await crypto.subtle.importKey('raw',enc.encode(clave),'PBKDF2',false,['deriveBits']);
    return hex(await crypto.subtle.deriveBits({name:'PBKDF2',salt:enc.encode(sal),iterations:it,hash:'SHA-256'},key,256));
  }catch{}}
  await new Promise(r=>setTimeout(r,20));
  return hex(pbkdf2js(enc.encode(clave),enc.encode(sal),it));

function leerKg(p){
  const ins=[...document.querySelectorAll('#pedLines .qty')];

}
async function savePedido(p,cambios,estado){
  const {id,...rest}=p;const data={...rest,...cambios};
  if(estado&&estado!==p.estado){data.estado=estado;data.historial=[...(p.historial||[]),{e:estado,u:me.id||'',t:Date.now()}].slice(-30)}

    if(estado&&['preparacion','preparado','entregado'].includes(estado)){for(const d of destinatarios('ped_estado'))await notificar(d,`${nameOf(me.id)}: pedido ${(EST[estado]||[estado])[0].toLowerCase()} · ${resumenPed(data)}`,{pedidoId:id})}
    if(cambios.asignado&&cambios.asignado!==p.asignado&&cambios.asignado!==me.id)await avisa(cambios.asignado,'ped_asignado',`Te han asignado un pedido · ${resumenPed(data)}`,{pedidoId:id});
    return true}return false;
}
async function entregar(p){
  const lineas=leerKg(p);const fecha=today();

  if(!vl.length){toast('No hay kilos que entregar.');return}
  let ventaId=S.ventas.find(v=>v.pedidoId===p.id)?.id;
  if(!ventaId){
    const ref=db.collection('ventas').doc();
    try{await ref.set({fecha,empresaId:p.empresaId,lineas:vl,total:Math.round(vl.reduce((a,l)=>a+l.kg*l.precio,0)*100)/100,cobrado:false,nota:`Pedido ${p.num||''}`,num:nextNum(fecha),creado:Date.now(),pedidoId:p.id})}catch(e){toast(errMsg(e));return}

  }
  if(await savePedido(p,{lineas,ventaId,entregado:fecha},'entregado'))toast('Pedido entregado. Venta y albarán creados.');
}

const CATS=['Abono','Fitosanitario','Riego','Envases','Herramientas','Otros'];
const UNIDADES=['kg','L','sacos','ud','cajas','rollos','m'];
const ALM='';

const insumo=id=>byId(S.insumos,id);
const cant=(n,u)=>nf.format(Math.round((n||0)*100)/100)+' '+(u||'');
function invStock(){
  const m=new Map(),add=(i,l,q)=>{const k=i+'|'+(l||'');m.set(k,(m.get(k)||0)+q)};
  S.movimientos.forEach(x=>{const q=+x.cantidad||0;if(x.tipo==='entrada')add(x.insumoId,x.parcelaId,q);else if(x.tipo==='uso')add(x.insumoId,x.parcelaId,-q);else if(x.tipo==='traslado'){add(x.insumoId,x.parcelaId,-q);add(x.insumoId,x.destinoId,q)}});
  return m;
}
const stockEn=(m,i,l)=>m.get(i+'|'+(l||''))||0;
const totalDe=(m,i)=>locs().reduce((a,l)=>a+stockEn(m,i,l.id),0);
const bajo=(m,a)=>+a.minimo>0&&totalDe(m,a.id)<+a.minimo;
const TIPO={entrada:['Entrada','+'],uso:['Uso en el campo','−'],traslado:['Traslado','⇄']};
function vInventario(){
  const ed=can('inv_editar'),m=invStock(),arts=S.insumos.slice().sort((a,b)=>(a.categoria||'').localeCompare(b.categoria||'')||(a.nombre||'').localeCompare(b.nombre||''));
  let h=ed?`<div class="triple" style="margin-bottom:10px"><button class="btn leaf" data-act="add-mov:entrada">+ Entrada</button><button class="btn primary" data-act="add-mov:uso">− Uso</button><button class="btn" data-act="add-mov:traslado">⇄ Traslado</button></div><div style="margin-bottom:12px"><button class="btn" style="width:100%;justify-content:center" data-act="add-insumo">+ Añadir material nuevo</button></div>`:'';
  if(!arts.length)return h+emptyBox('Inventario vacío','Da de alta los abonos, tratamientos, cajas y demás material. Después anota las entradas y lo que se gasta en cada campo.','add-insumo','Añadir primer material');
  const bajos=arts.filter(a=>bajo(m,a));
  if(bajos.length)h+=`<div class="lowbar"><b>${bajos.length} ${bajos.length===1?'material con poco stock':'materiales con poco stock'}:</b> ${bajos.map(a=>esc(a.nombre)+' ('+cant(totalDe(m,a.id),a.unidad)+')').join(', ')}</div>`;
  h+=segBtns('gi',F.gi,[['campo','Campo'],['articulo','Material'],['mov','Movimientos']]);
  if(F.gi==='campo'){
    h+=locs().map(l=>{
      const rows=arts.map(a=>({a,q:stockEn(m,a.id,l.id),usado:S.movimientos.some(x=>x.insumoId===a.id&&((x.parcelaId||'')===l.id||(x.tipo==='traslado'&&(x.destinoId||'')===l.id)))})).filter(r=>r.q||r.usado);
      const con=rows.filter(r=>r.q>0).length;
      const body=rows.length?rows.map(r=>`<button class="row" style="grid-template-columns:minmax(0,1fr) auto" data-act="inv:${r.a.id}:${l.id||'_'}"><div class="main"><strong>${esc(r.a.nombre)}</strong><span>${esc(r.a.categoria||'')}</span></div><div class="fig"><b style="color:${r.q<0?'var(--bad)':'inherit'}">${cant(r.q,r.a.unidad)}</b></div></button>`).join(''):`<div class="row" style="cursor:default;grid-template-columns:1fr"><span class="hint">Sin material en ${l.id?'este campo':'el almacén'}.</span></div>`;
      return grp('i-c-'+(l.id||'alm'),l.id?'campo':'alm',esc(l.nombre),`${con} ${con===1?'material':'materiales'} con existencias`,'', '',body);
    }).join('');

let recBusy=false;const recHechos=new Set();
async function recordatorios(){
  if(!db||!me.id||!loaded.notas||!loaded.mensajes||recBusy)return;recBusy=true;
  try{const hoy=today();
    for(const n of S.notas){
      if(n.hecho||n.rec==null||n.rec===''||!paraMi(n))continue;
      const fa=addDias(n.fecha,-(+n.rec||0));if(fa>hoy||n.fecha<addDias(hoy,-3))continue;
      const id=`rec-${n.id}-${me.id}-${fa}`;if(recHechos.has(id)||byId(S.mensajes,id))continue;recHechos.add(id);
      const cuando=n.fecha===hoy?'para hoy':n.fecha===addDias(hoy,1)?'para mañana':n.fecha>hoy?'para el '+fdate(n.fecha):'del '+fdate(n.fecha);
      try{await db.collection('mensajes').doc(id).set({de:n.autor||'',para:me.id,texto:`Recordatorio ${cuando}: ${n.titulo}${n.hora?' · '+n.hora:''}${n.parcelaId?' · '+parName(n.parcelaId):''}`,t:Date.now(),leido:false,tipo:'aviso',notaId:n.id})}catch{}
    }
  }finally{recBusy=false}
}

  const nuevos=mios.filter(m=>!vistos.has(m.id));nuevos.forEach(m=>vistos.add(m.id));

  if(!n.length)return;

function vAvisos(){
  const avisos=S.mensajes.filter(m=>m.para===me.id&&m.tipo!=='msg').sort((a,b)=>b.t-a.t);
  const nA=avisos.filter(m=>!m.leido).length;

async function startDemo(){

  subscribeAll();
}

(async()=>{
  if(!window.claude?.use){startDemo();return}
